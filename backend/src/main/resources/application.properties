server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/molino;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
app.jwt.secret=${JWT_SECRET:}
app.jwt.days=7
app.auth.allowed-emails=${ALLOWED_EMAILS:}
app.auth.open-signup=${OPEN_SIGNUP:false}
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-opus-5-5}
