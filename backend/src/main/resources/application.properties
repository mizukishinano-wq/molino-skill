server.port=${PORT:8080}
# ローカルは H2 のファイル。Flyway に切り替えたとき、Hibernate が作った古いファイル（data/molino）と混ざらないよう名前を変えた
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/molino-local;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
# Supabase の無料プランは同時接続数が少ないので、Spring が持つ接続の数を抑える
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
# テーブルは Flyway（db/migration）で作る。Hibernate はテーブルを変えず、Entity と合っているかだけを起動時に確かめる
spring.jpa.hibernate.ddl-auto=validate
# {vendor} は接続先の種類（h2 / postgresql）に置き換わる。PostgreSQL だけで動かす SQL は db/vendor/postgresql に置く
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
app.jwt.secret=${JWT_SECRET:}
app.jwt.days=7
app.auth.allowed-emails=${ALLOWED_EMAILS:}
app.auth.open-signup=${OPEN_SIGNUP:false}
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-opus-5-5}
